<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Patrik Madarász — Portfólió</title>
  <meta name="description" content="Patrik Madarász grafikus portfóliója: forgó liquid glass pillek, zenére reagáló fényhullámok.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;800&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<canvas id="gl" aria-label="Forgó 3D liquid glass pillek a projektekkel"></canvas>

<!-- Projekt-aloldal: pillre kattintva nyílik; a kártyákat a WebGL rajzolja (js/project.js), ez a réteg csak a görgetést kapja el -->
<section class="project" id="project" hidden aria-label="Projekt">
  <button class="back" id="projectBack" type="button" aria-label="Vissza a projektekhez">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg><span>Vissza</span>
  </button>
  <div class="pj-input" id="pjInput"></div>
  <p class="sr-only" id="pjText"></p>
</section>

<div class="ui">
  <svg class="logo-top" id="logoTop" viewBox="0 0 335.11 155.11" role="img" aria-label="MP"></svg>
  <div class="row">
    <div class="stack-label"><span>Patrik Madarász</span><span class="dim">Munkák / Válogatás</span></div>
    <div class="top-right">
      <div class="stack-label"><span>06 projekt</span><span class="dim">2025 — 2026</span></div>
      <button class="btn square" id="panelBtn" type="button" aria-expanded="false" aria-controls="panel" aria-label="Glass beállítások">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M4.5 9.5a4 4 0 0 0 4 3"/></svg>
      </button>
      <div class="panel" id="panel" hidden>
        <header>
          <span><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M4.5 9.5a4 4 0 0 0 4 3"/></svg>Glass</span>
          <span><button class="reset" id="copy" type="button" title="Beállítások másolása a vágólapra">Másolás</button><button class="reset" id="reset" type="button">Alaphelyzet</button></span>
        </header>
        <div class="sec">
          <div class="ctl"><label for="c-ang">Light</label><input type="range" id="c-ang" min="-180" max="180" step="1"><output for="c-ang"></output></div>
          <div class="ctl"><label for="c-int">Intensity</label><input type="range" id="c-int" min="0" max="100" step="1"><output for="c-int"></output></div>
        </div>
        <div class="sec">
          <div class="ctl"><label for="c-refr">Refraction</label><input type="range" id="c-refr" min="0" max="100" step="1"><output for="c-refr"></output></div>
          <div class="ctl"><label for="c-depth">Depth</label><input type="range" id="c-depth" min="0" max="100" step="1"><output for="c-depth"></output></div>
          <div class="ctl"><label for="c-disp">Dispersion</label><input type="range" id="c-disp" min="0" max="100" step="1"><output for="c-disp"></output></div>
          <div class="ctl"><label for="c-frost">Frost</label><input type="range" id="c-frost" min="0" max="100" step="1"><output for="c-frost"></output></div>
          <div class="ctl"><label for="c-splay">Splay</label><input type="range" id="c-splay" min="0" max="100" step="1"><output for="c-splay"></output></div>
        </div>
        <div class="sec">
          <div class="ctl"><label for="c-spin">Forgás</label><input type="range" id="c-spin" min="0" max="100" step="1"><output for="c-spin"></output></div>
        </div>
        <div class="sec">
          <div class="sec-title">Hullám</div>
          <div class="seg" role="group" aria-label="Hullám stílusa"><button type="button" class="seg-btn" id="ws-0" aria-pressed="true">Fényszalag</button><button type="button" class="seg-btn" id="ws-1" aria-pressed="false">Üveg</button></div>
          <div class="ctl"><label for="c-react">Reakció</label><input type="range" id="c-react" min="0" max="100" step="1"><output for="c-react"></output></div>
          <div class="ctl"><label for="c-wlight">Fényerő</label><input type="range" id="c-wlight" min="0" max="100" step="1"><output for="c-wlight"></output></div>
          <div class="ctl"><label for="c-wpush">Behúzás</label><input type="range" id="c-wpush" min="0" max="100" step="1"><output for="c-wpush"></output></div>
          <div class="ctl"><label for="c-wshift">Középre</label><input type="range" id="c-wshift" min="0" max="100" step="1"><output for="c-wshift"></output></div>
          <div class="ctl"><label for="c-wspeed">Áramlás</label><input type="range" id="c-wspeed" min="0" max="100" step="1"><output for="c-wspeed"></output></div>
          <div class="ctl"><label for="c-surge">Lendület</label><input type="range" id="c-surge" min="0" max="100" step="1"><output for="c-surge"></output></div>
          <div class="ctl"><label for="c-bpm">BPM-szinkron</label><input type="checkbox" id="c-bpm"><output id="bpmOut">92 BPM</output></div>
        </div>
      </div>
    </div>
  </div>
  <div></div>
  <div class="bottom">
    <div class="pl" id="pl" role="group" aria-label="Zenelejátszó">
      <div class="pl-c">
        <div class="c-top">
          <label class="art" for="file" title="Saját zene betöltése"><img alt="Borító" src="assets/cover.jpg"><span aria-hidden="true">+</span></label>
          <input type="file" id="file" accept="audio/*" hidden>
          <div class="meta">
            <span class="artist"><span id="trackArtist">Demó</span> · <span id="trackSub">0:00 / 0:20</span></span>
            <b id="trackName">Demó loop</b>
            <input type="range" id="seek" min="0" max="1000" step="1" value="0" aria-label="Pozíció a zenében" disabled>
          </div>
        </div>
        <button class="cb c-prev" id="prev" type="button" aria-label="Előző"><svg viewBox="0 0 16 16"><path d="M3.5 3h1.6v10H3.5zM13 3v10L6 8z"/></svg></button>
        <button class="cb c-play" id="play" type="button" aria-label="Lejátszás"><svg id="ico" viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z"/></svg></button>
        <button class="cb c-next" id="next" type="button" aria-label="Következő"><svg viewBox="0 0 16 16"><path d="M10.9 3h1.6v10h-1.6zM3 3v10l7-5z"/></svg></button>
        <div class="c-vol" id="vol" role="slider" tabindex="0" aria-label="Hangerő" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80"><div class="vol-fill" id="volFill"></div></div>
      </div>
      <button class="spk" id="spk" type="button" aria-label="Lejátszó megnyitása"><svg viewBox="0 0 16 16"><path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path id="spkWaves" d="M10.5 5.5a3.5 3.5 0 0 1 0 5M12.3 3.8a6 6 0 0 1 0 8.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
    </div>
    <div class="caption" aria-live="polite">
      <span class="meta dim" id="capMeta">Válassz egy pillt</span>
      <span class="name" id="capName">&nbsp;</span>
    </div>
    <div class="hint dim">Görgess vagy húzd<br>Hangszóró → lejátszó</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
